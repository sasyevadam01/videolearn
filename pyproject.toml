[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "videolearn4claude"
version = "0.1.0"
description = "VideoLearn 4Claude: give Claude ears for your screen recordings. Speech transcript + frames + mouse-pointer position, synchronized, 100% local."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sasyevadam01" }]
keywords = ["claude", "mcp", "whisper", "screen-recording", "video", "transcription", "cursor-tracking", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "faster-whisper>=1.1",
  "av>=14,<17",             # av 17+ breaks faster-whisper 1.2 (metadata_errors)
  "pillow>=10",
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
# Connector for Claude Desktop / Claude Code (MCP server)
mcp = ["mcp>=1.2,<2"]            # mcp 2.x renamed FastMCP; this server targets the 1.x API
# NVIDIA GPU acceleration (Windows / Linux): ~25 s instead of ~90 s for a 3-minute video
gpu = [
  "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
  "nvidia-cudnn-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/sasyevadam01/videolearn-4claude"
Issues = "https://github.com/sasyevadam01/videolearn-4claude/issues"

[project.scripts]
videolearn = "videolearn4claude.cli:main"
videolearn-mcp = "videolearn4claude.mcp_server:main"
videolearn-prefetch = "videolearn4claude.prefetch:main"

[project.gui-scripts]
videolearn-app = "videolearn4claude.app:main"

[tool.setuptools]
packages = ["videolearn4claude"]

[tool.setuptools.package-data]
videolearn4claude = ["ui/*"]
