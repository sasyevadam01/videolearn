name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install light dependencies (no Whisper needed for the unit tests)
        run: python -m pip install pillow numpy scipy
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .
      - name: Check the installer parses
        shell: powershell
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errs)
          if ($errs.Count) { $errs | ForEach-Object { $_.Message }; exit 1 }
